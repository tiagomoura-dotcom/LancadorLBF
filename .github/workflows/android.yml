name: APK Android

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Conferir www/
        run: |
          for f in www/index.html www/nativo.js www/icone-512.png; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Falta $f. Envie a pasta www/ do Lançador para o repositório."
              exit 1
            fi
          done

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Dependências do Capacitor
        run: npm ci

      - name: Ícone a partir de www/icone-512.png
        run: npm run icones

      - name: Copiar www/ para o projeto Android
        run: npx cap sync android

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lancador.apk

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: lancador-debug
          path: lancador.apk
          if-no-files-found: error

      - name: Atualizar a release "ultima-versao"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f ultima-versao
          git push -f origin refs/tags/ultima-versao
          notes="APK de debug compilado do commit ${GITHUB_SHA::7} em $(date -u '+%d/%m/%Y %H:%M') UTC."
          if gh release view ultima-versao >/dev/null 2>&1; then
            gh release edit ultima-versao --title "Última versão" --notes "$notes" --latest
          else
            gh release create ultima-versao --title "Última versão" --notes "$notes" --latest
          fi
          gh release upload ultima-versao lancador.apk --clobber
